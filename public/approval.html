<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação • C4U</title><style>
:root{--accent:#6d3cc4;--ink:#19171c;--paper:#f1efeb;--line:#d8d4ce;--muted:#716b74;font-family:Aptos,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}.top{background:#19161d;color:white;padding:30px 20px;border-bottom:3px solid var(--accent)}.wrap{max-width:980px;margin:auto}.brand{font:600 12px Bahnschrift,"Arial Narrow",sans-serif;color:#aaa3ae}.top h1{font:650 30px/1.1 Bahnschrift,"Arial Narrow",sans-serif;letter-spacing:-.03em;margin:10px 0 5px}.top p{margin:0;color:#aaa3ae;font-size:12px}.main{max-width:980px;margin:22px auto;padding:0 18px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:22px;box-shadow:0 1px 0 rgba(20,18,22,.03);margin-bottom:12px}.card h2{font:650 20px Bahnschrift,"Arial Narrow",sans-serif;letter-spacing:-.02em}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:16px}.mini{background:#f7f5f2;padding:14px;border-right:1px solid var(--line)}.mini:last-child{border-right:0}.mini small{display:block;color:var(--muted);margin-bottom:4px;font-size:11px}.mini b{font:650 18px Bahnschrift,"Arial Narrow",sans-serif}.items{width:100%;border-collapse:collapse}.items th,.items td{text-align:left;padding:11px;border-bottom:1px solid #e5e2dd}.items th{font-size:11px;color:#5f5962;background:#f1efeb}.total{text-align:right;font:650 28px Bahnschrift,"Arial Narrow",sans-serif;margin-top:18px}.layout{max-width:100%;border-radius:7px;border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid transparent;border-radius:7px;padding:12px 16px;font-weight:650;cursor:pointer}.approve{background:var(--accent);color:#fff;border-color:var(--accent)}.change{background:#f5f3ef;color:#38333b;border-color:#d8d4ce}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #cec9c3;border-radius:7px;font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,60,196,.08)}.status{text-align:center;padding:34px}.status h2{margin-bottom:7px}.ok{color:#26704d}.warn{color:#97631f}@media(max-width:700px){.summary{grid-template-columns:1fr}.mini{border-right:0;border-bottom:1px solid var(--line)}.mini:last-child{border-bottom:0}.card{padding:16px}.items{font-size:13px}.top h1{font-size:24px}}
</style><link rel="stylesheet" href="/c4u-dialogs.css"></head><body><header class="top"><div class="wrap"><div class="brand">Toca dos Brindes · Aprovação digital</div><h1 id="title">Carregando aprovação...</h1><p id="subtitle">C4U APP</p></div></header><main class="main" id="app"><div class="card status">Carregando...</div></main><script src="/c4u-dialogs.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const token=location.pathname.split('/').pop();let data;
async function load(){try{const r=await fetch('/api/public/approval/'+encodeURIComponent(token));if(!r.ok)throw new Error('Este link de aprovação não é válido.');data=await r.json();render()}catch(e){document.getElementById('app').innerHTML='<div class="card status"><h2>Não foi possível abrir</h2><p>'+esc(e.message)+'</p></div>'}}
function render(){const a=data.approval,q=data.quote;document.getElementById('title').textContent=a.title||'Aprovação';document.getElementById('subtitle').textContent=(data.company?.name||'Toca dos Brindes')+' • '+(q.number||'Orçamento');if(a.status!=='pending'){document.getElementById('app').innerHTML=`<div class="card status"><h2 class="${a.status==='approved'?'ok':'warn'}">${a.status==='approved'?'✓ Aprovação confirmada':'Alteração solicitada'}</h2><p>Esta solicitação já foi respondida e o registro foi salvo.</p></div>`;return}document.getElementById('app').innerHTML=`<div class="card"><p>${esc(a.message||'Confira os dados abaixo.')}</p><div class="summary"><div class="mini"><small>Cliente</small><b>${esc(q.client||'—')}</b></div><div class="mini"><small>Orçamento</small><b>${esc(q.number||'—')}</b></div><div class="mini"><small>Valor total</small><b>${brl(q.total)}</b></div></div></div><div class="card"><h2>Itens</h2><div style="overflow:auto"><table class="items"><thead><tr><th>Item</th><th>Qtd.</th><th>Unitário</th><th>Total</th></tr></thead><tbody>${(q.items||[]).map(i=>`<tr><td><b>${esc(i.productName||i.description||'Item')}</b><br><small>${esc(i.description||'')}</small></td><td>${Number(i.qty||0)}</td><td>${brl(i.unitPrice)}</td><td>${brl(i.grossTotal||Number(i.qty||0)*Number(i.unitPrice||0))}</td></tr>`).join('')}</tbody></table></div><div class="total"><b>${brl(q.total)}</b></div></div>${a.layoutImage?`<div class="card"><h2>Layout para aprovação</h2><img class="layout" src="${a.layoutImage}" alt="Layout"></div>`:''}<div class="card"><h2>Confirmação</h2><div class="field"><label>Seu nome *</label><input id="clientName" placeholder="Nome de quem está aprovando"></div><div class="field"><label>Observação (opcional)</label><textarea id="note" rows="3" placeholder="Digite alguma observação, se necessário"></textarea></div><div class="actions"><button class="btn approve" onclick="respond('approved')">✓ Aprovar orçamento e layout</button><button class="btn change" onclick="respond('changes')">Solicitar alteração</button></div></div>`}
async function respond(action){const name=document.getElementById('clientName').value.trim();if(!name){await C4UDialog.notice('Informe seu nome para registrar a resposta.');return}if(!await C4UDialog.confirm(action==='approved'?'Confirmar aprovação?':'Enviar solicitação de alteração?'))return;const r=await fetch('/api/public/approval/'+encodeURIComponent(token)+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,clientName:name,note:document.getElementById('note').value})});const j=await r.json().catch(()=>({}));if(!r.ok){await C4UDialog.notice(j.error||'Não foi possível registrar.');return}data.approval.status=j.status;render()}
load();
</script></body></html>
